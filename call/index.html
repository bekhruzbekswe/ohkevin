<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oh Kevin</title>
<style>
  /* The page is the chat. Tokens and rules follow design/system.css (copied, so this page stays one file):
     one accent (marigold) only where it is your move; four sizes 48/22/17/14; space 4 8 16 24 40 64 (+12); radii 20 and pill. */
  :root {
    --cv-ground: #F6F3EC; --cv-raised: #FFFFFF; --cv-sunk: #ECE8DF; --cv-hair: rgba(27, 26, 23, .12);
    --cv-ink: #1B1A17; --cv-ink-2: #57534B; --cv-ink-3: #6B665D; --cv-on-ink: #F6F3EC; --cv-you: #36332D; --cv-on-you: #F6F3EC; --cv-voice: #E9E4DA;
    --cv-accent: #F4A62A; --cv-accent-down: #E2951A; --cv-on-accent: #1B1A17; --cv-accent-ink: #8A5000; --cv-accent-word: #D98E0B;
    --cv-done: #256B42; --cv-wrong: #B82E24; --cv-wrong-on-ink: #FF8073;
    --cv-shadow: 0 1px 2px rgba(27,26,23,.06), 0 8px 24px rgba(27,26,23,.08);
    --cv-font-display: ui-serif, "New York", "Iowan Old Style", "Palatino", Georgia, serif;
    --cv-font-text: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", sans-serif;
    --cv-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --cv-t-display: 48px; --cv-t-title: 22px; --cv-t-body: 17px; --cv-t-small: 14px;
    --cv-s-0: 4px; --cv-s-1: 8px; --cv-s-h: 12px; --cv-s-2: 16px; --cv-s-3: 24px; --cv-s-4: 40px;
    --cv-r-surface: 20px; --cv-r-tail: 6px; --cv-r-pill: 999px;
    --cv-h-control: 48px; --cv-h-bar: 64px; --cv-w-capsule: 200px; --cv-w-slot: 120px; --cv-w-rail: 400px;
    --cv-ease: cubic-bezier(.2, .7, .2, 1); --edge: 40px; /* the content's edge: the dots and the Settings card sit on it */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cv-ground: #181715; --cv-raised: #38352F; --cv-sunk: #262421; --cv-hair: rgba(246, 243, 236, .14);
      --cv-ink: #F6F3EC; --cv-ink-2: #B5B0A6; --cv-ink-3: #9A958B; --cv-on-ink: #1B1A17; --cv-you: #D6D0C3; --cv-on-you: #1B1A17; --cv-voice: #2E2B27;
      --cv-accent-down: #FFB84A; --cv-accent-ink: #F4B551; --cv-accent-word: #F4A62A;
      --cv-done: #73C795; --cv-wrong: #FF8073; --cv-wrong-on-ink: #B82E24;
      --cv-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--cv-ground); color: var(--cv-ink); font: 400 var(--cv-t-body)/24px var(--cv-font-text); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  .sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* buttons: quiet, primary (one per view), danger (red words); one height */
  .cv-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--cv-s-1); height: var(--cv-h-control); padding: 0 var(--cv-s-3);
    border: 0; border-radius: var(--cv-r-pill); background: var(--cv-sunk); color: var(--cv-ink); font: 600 var(--cv-t-body)/1 var(--cv-font-text); letter-spacing: -0.01em;
    white-space: nowrap; cursor: pointer; transition: background .15s var(--cv-ease), transform .15s var(--cv-ease); }
  .cv-btn:active { transform: scale(.98); }
  :focus-visible { outline: 3px solid var(--cv-accent); outline-offset: 2px; }
  .cv-btn--primary { background: var(--cv-accent); color: var(--cv-on-accent); }
  .cv-btn--primary:hover { background: var(--cv-accent-down); }
  .cv-btn--danger { color: var(--cv-wrong); }
  .cv-btn--wide { width: 100%; }
  .cv-btn[disabled] { opacity: .35; cursor: default; }
  .cv-btn.ro { cursor: default; pointer-events: none; }
  .cv-btn.ro:active { transform: none; }
  .cv-btn--pick { justify-content: space-between; padding: 0 20px 0 var(--cv-s-3); font-weight: 400; }
  .cv-arrows { width: 10px; height: 16px; flex: none; color: var(--cv-ink-3); position: relative; display: inline-block; transition: transform .15s var(--cv-ease); }
  .cv-arrows::before, .cv-arrows::after { content: ""; position: absolute; left: 1px; width: 6px; height: 6px; border-left: 2px solid currentColor; border-top: 2px solid currentColor; }
  .cv-arrows::before { top: 1px; transform: rotate(45deg); }
  .cv-arrows::after { bottom: 1px; transform: rotate(225deg); }
  .cv-btn .cv-mark { font-size: 16px; }
  .cv-card .cv-btn:not(.cv-btn--primary) { background: color-mix(in srgb, var(--cv-ink) 9%, transparent); }

  /* the mark: chevron + three bars. It is the voice. */
  .cv-mark { display: inline-flex; align-items: center; gap: .14em; height: 1em; color: inherit; flex: none; }
  .cv-mark b { width: .42em; height: .42em; margin-right: .06em; border-top: .13em solid currentColor; border-right: .13em solid currentColor; border-radius: .03em; transform: rotate(45deg) translate(-.06em, .06em); }
  .cv-mark i { width: .13em; border-radius: .1em; background: currentColor; height: .55em; transform-origin: center; }
  .cv-mark i:nth-of-type(2) { height: 1em; } .cv-mark i:nth-of-type(3) { height: .7em; }
  .cv-mark.is-listening i { animation: cv-breathe 2.4s ease-in-out infinite; }
  .cv-mark.is-speaking i { animation: cv-speak .7s ease-in-out infinite; }
  .cv-mark.is-thinking i { height: .55em; animation: cv-pulse 1.2s ease-in-out infinite; }
  .cv-mark.is-speaking i:nth-of-type(2), .cv-mark.is-listening i:nth-of-type(2), .cv-mark.is-thinking i:nth-of-type(2) { animation-delay: -.25s; }
  .cv-mark.is-speaking i:nth-of-type(3), .cv-mark.is-listening i:nth-of-type(3), .cv-mark.is-thinking i:nth-of-type(3) { animation-delay: -.5s; }
  .cv-mark.is-muted i, .cv-mark.is-waiting i { height: .13em !important; animation: none; }
  .cv-mark.is-waiting i { animation: cv-pulse 1.2s ease-in-out infinite; }
  @keyframes cv-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.8); } }
  @keyframes cv-speak { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
  @keyframes cv-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* the chat: both sides in bubbles; the voice's are serif */
  .cv-chat { display: flex; flex-direction: column; gap: var(--cv-s-3); overflow-y: auto; scrollbar-width: none; }
  .cv-chat--full { -webkit-mask-image: linear-gradient(to bottom, transparent 8px, #000 32px); mask-image: linear-gradient(to bottom, transparent 8px, #000 32px); }
  .cv-turn { display: flex; flex-direction: column; gap: var(--cv-s-0); max-width: 76%; flex: none; }
  .cv-turn--voice { align-self: flex-start; align-items: flex-start; }
  .cv-turn--you { align-self: flex-end; align-items: flex-end; }
  .cv-bubble { padding: var(--cv-s-h) var(--cv-s-3); border-radius: var(--cv-r-surface); overflow-wrap: anywhere; }
  .cv-turn--voice .cv-bubble { background: var(--cv-voice); font-family: var(--cv-font-display); letter-spacing: 0; }
  .cv-turn--you .cv-bubble { background: var(--cv-you); color: var(--cv-on-you); }
  .cv-turn--voice .cv-bubble:last-child { border-bottom-left-radius: var(--cv-r-tail); }
  .cv-turn--you .cv-bubble:last-child { border-bottom-right-radius: var(--cv-r-tail); }
  /* a problem the call server reports: the voice's bubble with red words; nowhere else */
  .cv-turn--voice .cv-bubble--wrong { color: var(--cv-wrong); }
  .cv-turn--you .cv-bubble--live { color: color-mix(in srgb, var(--cv-on-you) 65%, var(--cv-you)); }
  /* the start of a call: a line on the screen, until the first words. Never spoken. */
  .cv-greeting { display: none; flex: 1; align-items: center; justify-content: center; padding-bottom: var(--cv-s-3); text-align: center; font: 400 var(--cv-t-display)/1.1 var(--cv-font-display); letter-spacing: -0.02em; text-wrap: balance; }
  .empty .cv-greeting { display: flex; } .empty .cv-chat { display: none; }

  /* workers: a quiet rail of cards; a card is a button; the asking card is the request */
  .cv-card { background: var(--cv-sunk); border-radius: var(--cv-r-surface); box-shadow: inset 0 0 0 1px var(--cv-hair); padding: var(--cv-s-2) var(--cv-s-3);
    display: flex; flex-direction: column; gap: var(--cv-s-0); flex: none; cursor: pointer; }
  .cv-card:has(> .cv-card__head:focus-visible) { outline: 3px solid var(--cv-accent); outline-offset: 2px; }
  .cv-card--line > :not(.cv-card__head) { display: none; }
  .cv-card--ask { padding: var(--cv-s-3); gap: var(--cv-s-2); box-shadow: inset 0 0 0 2px var(--cv-accent); cursor: default; }
  .cv-card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--cv-s-2); }
  button.cv-card__head { width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-align: left; cursor: pointer; }
  button.cv-card__head:focus-visible { outline: none; }
  .cv-card__head .cv-state { margin-left: auto; }
  .cv-title { font: 600 var(--cv-t-title)/28px var(--cv-font-text); letter-spacing: -0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cv-card--ask .cv-title { font: 600 var(--cv-t-body)/24px var(--cv-font-text); letter-spacing: -0.01em; }
  .cv-quiet { color: var(--cv-ink-2); overflow-wrap: anywhere; min-height: 24px; }
  .cv-question { font: 600 var(--cv-t-title)/28px var(--cv-font-display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .cv-command { display: block; font: 400 var(--cv-t-small)/20px var(--cv-font-mono); letter-spacing: 0; color: var(--cv-ink-2); margin: var(--cv-s-1) 0 0; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 10em; overflow-y: auto; }
  .cv-card--ask .cv-btn:focus-visible { outline-color: var(--cv-ink); }
  .cv-card--ask .cv-command { max-height: none; overflow: visible; }
  .cv-card__actions { display: flex; gap: var(--cv-s-1); }
  .cv-card__actions .cv-btn--primary, .cv-card__actions .cv-btn--wide { flex: 1; width: auto; }
  .cv-card.is-open .cv-card__actions { margin-top: var(--cv-s-h); }
  .cv-chev { width: 9px; height: 9px; flex: none; border-right: 2px solid var(--cv-ink-3); border-bottom: 2px solid var(--cv-ink-3); transform: rotate(-45deg); transition: transform .2s var(--cv-ease); }
  .cv-card.is-open .cv-chev { transform: rotate(45deg) translate(-2px, -2px); }
  .cv-state { display: inline-flex; align-items: center; gap: var(--cv-s-1); font: 600 var(--cv-t-body)/24px var(--cv-font-text); letter-spacing: -0.01em; color: var(--cv-ink-2); white-space: nowrap; }
  .cv-state::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .cv-state--working { font-weight: 400; }
  .cv-state--working::after { width: 3px; height: 14px; border-radius: 2px; margin: 0 6px; box-shadow: -6px 0 0 0 currentColor, 6px 0 0 0 currentColor; animation: cv-pulse 1.4s var(--cv-ease) infinite; }
  .cv-state--asking, .cv-state--waiting { color: var(--cv-accent-ink); }
  .cv-state--done { color: var(--cv-done); }
  .cv-state--done::after { width: 7px; height: 13px; border-radius: 0; background: none; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); margin: 0 4px 0 2px; }

  /* the call bar: one board, divided by hairlines: capsule · field · Mute · End */
  .cv-capsule { display: inline-flex; align-items: center; gap: var(--cv-s-h); height: var(--cv-h-control); min-width: var(--cv-w-capsule); padding: 0 var(--cv-s-2); white-space: nowrap; flex: none; }
  .cv-capsule .cv-mark { font-size: 28px; }
  .cv-capsule__word { font: italic 400 var(--cv-t-title)/1 var(--cv-font-display); letter-spacing: 0; }
  .cv-capsule.is-wrong { color: var(--cv-wrong); }
  .cv-bar { display: flex; align-items: center; height: var(--cv-h-bar); padding: 0 0 0 var(--cv-s-1); background: var(--cv-raised); color: var(--cv-ink); border-radius: var(--cv-r-pill); box-shadow: var(--cv-shadow); flex: none; overflow: hidden; }
  .cv-bar:focus-within { box-shadow: var(--cv-shadow), 0 0 0 3px var(--cv-accent); }
  .cv-field { flex: 1; min-width: 0; height: 32px; padding: 0 var(--cv-s-3); border: 0; border-left: 1px solid var(--cv-hair); border-radius: 0; background: none; color: inherit; font: 400 var(--cv-t-body)/1 var(--cv-font-text); }
  .cv-field::placeholder { color: var(--cv-ink-3); opacity: 1; }
  .cv-field:focus-visible { outline: none; }
  .cv-bar .cv-btn { align-self: stretch; height: auto; flex: none; position: relative; border-radius: 0; background: none; padding: 0 var(--cv-s-2); }
  .cv-bar .cv-btn:not(.cv-btn--danger) { width: var(--cv-w-slot); }
  .cv-bar .cv-btn--danger { padding: 0 28px 0 var(--cv-s-3); }
  .cv-bar .cv-btn:hover:not([disabled]) { background: color-mix(in srgb, currentColor 10%, transparent); }
  .cv-bar .cv-btn:active { transform: none; }
  .cv-bar .cv-btn[disabled] { opacity: 1; color: color-mix(in srgb, var(--cv-ink) 35%, transparent); } /* only the word fades: the hairline keeps its strength */
  .cv-bar .cv-btn::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--cv-hair); transition: opacity .15s var(--cv-ease); }
  .cv-bar .cv-btn:hover:not([disabled])::before, .cv-bar .cv-btn:hover:not([disabled]) + .cv-btn::before { opacity: 0; }
  .cv-bar .cv-btn--primary { color: var(--cv-accent-word); }
  .cv-bar.is-muted { background: var(--cv-ink); color: var(--cv-on-ink); }
  .cv-bar.is-muted .cv-btn { color: var(--cv-on-ink); }
  .cv-bar.is-muted .cv-btn--danger { color: var(--cv-wrong-on-ink); }
  .cv-bar.is-muted .cv-btn::before { background: color-mix(in srgb, var(--cv-on-ink) 25%, transparent); }
  .cv-bar.is-muted .cv-field { border-color: color-mix(in srgb, var(--cv-on-ink) 25%, transparent); }
  .cv-bar.is-muted .cv-field::placeholder { color: color-mix(in srgb, var(--cv-on-ink) 65%, var(--cv-ink)); }
  /* narrow: the field goes below the state row */
  .cv-bar--two { flex-wrap: wrap; height: auto; padding: 0; border-radius: var(--cv-r-surface); }
  .cv-bar--two .cv-field { order: 1; flex: 0 0 100%; height: 52px; border: 0; border-top: 1px solid var(--cv-hair); }
  .cv-bar--two .cv-capsule { margin-right: auto; min-width: 0; height: 56px; padding-left: var(--cv-s-3); }
  .cv-bar--two .cv-btn { height: 56px; align-self: auto; }
  .cv-bar--two .cv-btn--danger { padding: 0 var(--cv-s-3); }
  .cv-bar--two .cv-btn::before { top: 12px; bottom: 12px; }

  /* layout: chat left, workers at the right (on top when narrow) */
  .cw-page { display: flex; gap: var(--cv-s-4); padding: var(--cv-s-4); height: 100%; }
  .cw-talk { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .cw-talk.alone { max-width: 720px; margin: 0 auto; width: 100%; }
  .cw-talk .cv-chat { flex: 1; min-height: 0; padding-bottom: var(--cv-s-3); }
  .cw-talk .cv-bar { margin-top: 0; }
  .cw-crew { width: calc(var(--cv-w-rail) + 12px); flex: none; display: flex; flex-direction: column; gap: var(--cv-s-2); overflow-y: auto; scrollbar-width: none; position: relative; padding: 6px; margin: -6px; scroll-padding-bottom: 40px; }
  .cw-crew:empty, .alone + .cw-crew { display: none; }
  /* a rail that scrolls fades only the edge that has more behind it */
  .cw-crew.cv-rail--full { --t: 0px; --b: 0px; -webkit-mask-image: linear-gradient(transparent calc(var(--t) / 4), #000 var(--t), #000 calc(100% - var(--b)), transparent calc(100% - var(--b) / 4)); mask-image: linear-gradient(transparent calc(var(--t) / 4), #000 var(--t), #000 calc(100% - var(--b)), transparent calc(100% - var(--b) / 4)); }
  .cw-crew.is-scrolled { --t: 24px; } .cw-crew.more { --b: 24px; }
  .cw-page.n .cw-crew.is-scrolled { --t: 0px; } .cw-page.n .cw-crew.more { --b: 0px; } /* stacked, it ends on whole cards: no fade over a card's edge */
  .cw-page.n { flex-direction: column; gap: var(--cv-s-2); padding: var(--cv-s-4) var(--cv-s-2) var(--cv-s-2); } /* 40 at the top: room for the corner menu */
  .cw-page.n .cw-crew { order: -1; width: min(calc(100% + 12px), 732px); align-self: center; flex: 0 1 auto; min-height: 0; }
  .cw-page.n .cw-talk { flex: 1 1 0; min-height: 272px; width: 100%; max-width: 720px; align-self: center; }
  .cw-page.n .cw-talk .cv-chat { padding-bottom: var(--cv-s-2); }
  .cw-page.n .cv-turn { max-width: 86%; }
  .ob-hint { margin: calc(-1 * var(--cv-s-1)) 0 0 var(--cv-s-3); font: 400 var(--cv-t-small)/20px var(--cv-font-text); letter-spacing: 0; color: var(--cv-ink-2); } /* under the first finished card, the first call only */
  .cv-note { font: 400 var(--cv-t-small)/20px var(--cv-font-text); letter-spacing: 0; color: var(--cv-ink-2); text-align: left; margin: 0 0 var(--cv-s-h) var(--cv-s-3); }
  .cv-note:empty { display: none; }

  /* before a call / after it */
  .demo #callview, .demo #idle { height: calc(100% - 36px); }
  .cw-idle { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--cv-s-4); }
  /* the brand mark: ink bars arcing to a marigold ball (design/logo). Ink and paper follow the theme through currentColor. */
  .cv-brand { height: 100px; width: auto; aspect-ratio: 90 / 68; margin-bottom: 56px; fill: currentColor; flex: none; }
  .cv-brand circle { fill: var(--cv-accent); }
  .cw-idle h1 { font: 400 var(--cv-t-display)/1.1 var(--cv-font-display); letter-spacing: -0.02em; margin-bottom: var(--cv-s-4); text-wrap: balance; }
  .cw-idle h1:has(+ .cv-quiet:not([hidden])) { margin-bottom: var(--cv-s-1); }
  .cw-idle .cv-quiet { margin-bottom: var(--cv-s-4); }
  .cw-stack { width: 320px; max-width: 100%; display: flex; flex-direction: column; gap: var(--cv-s-1); }
  .cw-idle .cv-note { position: absolute; left: var(--cv-s-4); right: var(--cv-s-4); bottom: calc(var(--cv-s-4) + var(--cv-h-control) + var(--cv-s-2)); margin: 0 auto; width: fit-content; max-width: 560px; }

  /* the three dots at the window's top right, in every state: one press opens Settings */
  .cv-more { position: fixed; top: 6px; right: calc(var(--edge) - 6px); z-index: 3; width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; color: var(--cv-ink-2); }
  .cv-more:hover, .cv-more.is-open { background: color-mix(in srgb, var(--cv-ink) 9%, transparent); color: var(--cv-ink); }
  .cv-more i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: -6px 0 0 currentColor, 6px 0 0 currentColor; }
  /* Settings */
  /* Settings: a card that drops from the three dots, at the window's top right. A click elsewhere, the dots again or Escape closes it. */
  .cw-sheet { position: fixed; z-index: 3; top: 40px; right: var(--edge); width: min(400px, calc(100% - 2 * var(--edge))); max-height: calc(100% - 48px); overflow-y: auto; background: var(--cv-ground); color: var(--cv-ink);
    border-radius: var(--cv-r-surface); padding: var(--cv-s-3); box-shadow: var(--cv-shadow), 0 12px 40px rgba(0,0,0,.18), 0 0 0 1px var(--cv-hair); display: flex; flex-direction: column; gap: var(--cv-s-2); }
  .set { display: flex; flex-direction: column; gap: var(--cv-s-0); }
  .set > .lbl { color: var(--cv-ink-2); font: 400 var(--cv-t-small)/20px var(--cv-font-text); letter-spacing: 0; padding-left: var(--cv-s-1); }
  .set input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--cv-ink); flex: none; }
  .small { font: 400 var(--cv-t-small)/20px var(--cv-font-text); letter-spacing: 0; color: var(--cv-ink-2); }
  #vbtn small { margin: 0 var(--cv-s-1) 0 auto; font: 400 var(--cv-t-small)/20px var(--cv-font-text); color: var(--cv-ink-3); }
  #vbtn[aria-expanded=true] .cv-arrows { transform: rotate(180deg); }
  #vlist { max-height: 240px; overflow-y: auto; border-radius: var(--cv-r-surface); background: var(--cv-sunk); padding: var(--cv-s-1); }
  #vlist:focus-visible { outline-offset: 0; }
  .vh { font: 600 var(--cv-t-small)/20px var(--cv-font-text); color: var(--cv-ink-2); padding: var(--cv-s-1) var(--cv-s-2) var(--cv-s-0); }
  .vopt { display: flex; align-items: center; justify-content: space-between; padding: var(--cv-s-1) var(--cv-s-2); border-radius: var(--cv-s-2); cursor: pointer; }
  .vopt.act { background: color-mix(in srgb, var(--cv-ink) 9%, transparent); }

<body>
<main id="idle" class="cw-idle">
  <svg class="cv-brand" viewBox="4 18 90 68" aria-hidden="true"><rect x="6" y="77" width="4" height="6" rx="2"/><rect x="13.6" y="59.6" width="4" height="10" rx="2"/><rect x="21" y="44.9" width="4" height="14" rx="2"/><rect x="28.4" y="33" width="4" height="18" rx="2"/><rect x="35.8" y="24.9" width="4" height="20" rx="2"/><rect x="43" y="21.5" width="4" height="18" rx="2"/><rect x="50.2" y="21.9" width="4" height="14" rx="2"/><rect x="57.2" y="25" width="4" height="10" rx="2"/><rect x="64.2" y="29.9" width="4" height="8" rx="2"/><rect x="71.2" y="37.6" width="4" height="6" rx="2"/><circle cx="82.2" cy="54.8" r="10"/></svg>
  <h1 id="idleH">Oh Kevin</h1>

<div class="cw-page" id="callview" hidden>

</div>

<script>
const $ = id => document.getElementById(id)
const q = new URLSearchParams(location.search)
const K = q.get('k'), LANG = q.get('lang') || 'en-US'
const DEMO = q.has('demo') // replays a made-up call: nothing is fetched, posted or heard
const GO = q.get('go') === '1' // opened by the menu-bar launcher: the call starts on load, and End call ends it for good
// A send that fails says so (unless the page already says the call ended), and still rejects for the callers that handle it. /hangup is the one that ends the server mid-answer; /mic is only for the launcher.
const post = DEMO ? (path, body = {}) => { demoPost(path, body); return Promise.resolve() }
  : (path, body = {}) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-key': K }, body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw new Error(r.status) })
    .catch(err => { if (!['/hangup', '/mic'].includes(path) && !gone) note('That did not reach the call server. Check that the call is still running.'); throw err })
const now = () => performance.now()

let gone = false // the call server cannot be reached: the call is over on this side too
let link = '' // while it cannot: 'retry' (the browser is trying again), 'closed' (it gave up), 'over' (it did not come back in time)
let audio = null, started = false
// The listening and speaking (voice.mjs, frozen) with the helpers it uses for talking over the voice (ears.mjs). The page
// only shows what it does: `v` is its state, read at any time. ears.mjs stays out when the server does not serve it yet.
let call = null, v = null
const ready = DEMO ? Promise.resolve(wire(demoCall()))
  : Promise.all([import(`/voice.mjs?k=${encodeURIComponent(K)}`), import(`/ears.mjs?k=${encodeURIComponent(K)}`).catch(() => null)]).then(([{ createCall }, ears]) => {
    wire(createCall({
      ears, lang: LANG, voice: localStorage.getItem('voice') || 'bm_fable', headphones: $('phones').checked,
      now, setTimeout: (f, ms) => setTimeout(f, ms), clearTimeout: id => clearTimeout(id), setInterval: (f, ms) => setInterval(f, ms), clearInterval: id => clearInterval(id),
      post, tts: (voice, text) => fetch(`/tts?k=${encodeURIComponent(K)}&voice=${voice}&text=${encodeURIComponent(text)}`), audioContext: () => (audio ??= new AudioContext()),
      Recognition: window.SpeechRecognition || window.webkitSpeechRecognition, getUserMedia: c => navigator.mediaDevices.getUserMedia(c),
      speech: speechSynthesis, Utterance: britishMale(SpeechSynthesisUtterance),
    }))
  }, () => fetch('/').then(() => note('This page is newer than the running call server. Restart the call server.'), () => note("The call server isn't running."))) // the page loaded from somewhere else, or the server is gone
let sentMuted = null // what the server last heard about Mute: the launcher's pill shows it and can press it
let mutedOnItsWay = null
const tellMuted = () => { // sent again until it gets through
  if (DEMO || !call || sentMuted === v.muted || mutedOnItsWay === v.muted) return
  const m = mutedOnItsWay = v.muted
  post('/live', { muted: m }).then(() => { sentMuted = m }, () => {}).finally(() => { mutedOnItsWay = null })
}
// Chrome's own voice, when the local one isn't installed: a British male voice if Chrome has one (the product is Kevin),
// else Chrome's default for the call's language, as before. The voice is set on each sentence; nothing else changes.
function britishMale(Base) {
  const pick = () => { const vs = speechSynthesis.getVoices?.() ?? [], gb = vs.filter(v => /^en[-_]GB/i.test(v.lang))
    return gb.find(v => /UK English Male/i.test(v.name)) ?? gb.find(v => /^(Daniel|Arthur|Oliver)\b/.test(v.name)) ?? null }
  return class extends Base { constructor(text) { super(text); const v = pick(); if (v) this.voice = v } }
}
function wire(c) {
  call = c; v = c.state
  call.on('state', () => { refresh(); showSettings(); tellMuted() })
  call.on('interim', ghost)
  call.on('heard', ({ text, replaces }) => { if (replaces) retract(); row('you', text); tone(700, 70) })
  call.on('floor', mark)
  call.on('tally', tally)
  call.on('problem', (code, d) => {
    if (code === 'mic-ok') { if (blockedBy !== '') { blockedBy = ''; render(); if (GO) post('/mic', { blocked: '' }).catch(() => {}) } } // it hears: the launcher's banner goes, also one an earlier page (a reload) left
    else if (code === 'recognition') d.error === 'not-allowed' ? micBlocked(d.bySystem)
      : note(d.error === 'network' ? 'Speech recognition lost its connection. Start the call again. Typing still works.' : `Speech recognition stopped (${d.error}). Start the call again. Typing still works.`)
    else note({ 'old-server': `This page is newer than the running call server. ${GO ? 'Start a new call' : 'Restart the call server'} to be able to talk over the voice.`,
      'no-talk-over': NO_TALK_OVER, 'no-recognition': 'This browser has no speech recognition. Open this page in Chrome. Typing still works here.' }[code])
  })
}
// What this call has measured (helpers in stats.mjs); purely observational, and silent if the module does not load.
let S = null
const entries = []
if (!DEMO) import(`/stats.mjs?k=${encodeURIComponent(K)}`).then(m => { S = m }, () => {})
function tally(entry) {
  if (!S) return
  try { S.record(entries, entry); if (entry.kind === 'reply') console.info('[stats] ' + S.line(S.summary(entries))) } catch {}
}
const NO_TALK_OVER = 'This browser cannot hear you while the voice is speaking. To interrupt, press Space. Wearing headphones? Turn that on in Settings, behind the three dots.'

// ── what the call shows: the idle screen or the call, and the bar ───────────────
// The word is the voice's state, said once. Hearing you is still Listening.
function render() {
  if (!v) return
  started ||= v.live
  const inCall = v.live || !!blockedBy || (gone && link !== 'over')
  $('idle').hidden = inCall; $('callview').hidden = !inCall
  $('idleH').textContent = started || gone ? 'Call ended.' : 'Oh Kevin'; $('idleSub').hidden = started || gone
  $('call').disabled = $('call').hidden = gone
  const word = link === 'closed' ? 'Call lost' : link === 'retry' ? 'Reconnecting' : blockedBy ? 'Mic blocked' : v.speaking ? 'Speaking' : v.thinking ? 'Thinking' : v.muted ? 'Muted' : 'Listening'
  $('state').textContent = word
  const off = !!blockedBy || link === 'closed', down = !!link
  $('cmark').className = 'cv-mark is-' + (link === 'retry' ? 'waiting' : off || word === 'Muted' ? 'muted' : word.toLowerCase())
  $('capsule').classList.toggle('is-wrong', off)
  $('typed').classList.toggle('is-muted', v.muted && !off && !down)
  const mute = $('mute')
  mute.textContent = link === 'closed' ? 'Call again' : blockedBy ? 'Allow' : v.muted ? 'Unmute' : 'Mute'
  mute.disabled = link === 'retry'; mute.style.visibility = GO && link === 'closed' ? 'hidden' : '' // on a launcher call the way back is the menu bar's: the slot keeps its room, empty
  mute.classList.toggle('cv-btn--primary', off)
  layout()
}
function refresh() { render(); showCrew(); title() }
// Headphones only matter when the recogniser cannot use the echo-cancelled track (known once the ears have opened).
function showSettings() {
  $('phoneopt').hidden = v.trackPath !== false
  $('noset').hidden = !($('pick').hidden && $('phoneopt').hidden)
}
const note = text => { $('note').textContent = $('note0').textContent = text }

// The server holds its own lines (limit warnings) while you talk or the voice plays, so it is told when either starts or stops.
const told = { you: false, voice: false }
function mark(lane, on) { if (lane in told && told[lane] !== on) { told[lane] = on; post('/live', { [lane]: on }).catch(() => {}) } }

// ── sounds: short tones stand in for words ───────────────────────────────────
function tone(freq, ms, gain = 0.05, delay = 0) {
  if (!audio || DEMO) return
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + delay
  o.frequency.value = freq; g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000)
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + ms / 1000)
}

// The problem sound: once per problem, through the same audio as the tones (so the echo guard covers it), and like
// them it plays while muted and never in the demo. The same line again within 5 s is the same problem.
let problemAudio, lastProblem = '', lastProblemAt = 0
async function problemSound(text) {
  if (!audio || DEMO || (text === lastProblem && Date.now() - lastProblemAt < 5000)) return
  lastProblem = text; lastProblemAt = Date.now()
  try {
    problemAudio ??= await audio.decodeAudioData(await (await fetch('/problem.mp3?k=' + encodeURIComponent(K))).arrayBuffer())
    const src = audio.createBufferSource(), g = audio.createGain()
    src.buffer = problemAudio; g.gain.value = 0.3; src.connect(g).connect(audio.destination); src.start()
  } catch { problemAudio = undefined } // no sound: the red bubble still says it
}

// ── Settings: the voice, and headphones ──────────────────────────────────────
const VOICE_GROUPS = [['af_', 'US female'], ['am_', 'US male'], ['bf_', 'British female'], ['bm_', 'British male']]
const niceName = n => `${n[3].toUpperCase()}${n.slice(4)}`
const groupOf = n => VOICE_GROUPS.find(([p]) => n.startsWith(p))?.[1] ?? 'Other'
let opts = [], act = -1
function setVoices(names) { // the menu; which voice is used is the call's (voice.mjs)
  $('pick').hidden = !names.length; showSettings()
  closeList()
  const list = $('vlist'); list.replaceChildren(); opts = []
  for (const g of [...VOICE_GROUPS.map(([, t]) => t), 'Other']) {
    const mine = names.filter(n => groupOf(n) === g)
    if (!mine.length) continue
    const grp = document.createElement('div'), h = document.createElement('div')
    grp.setAttribute('role', 'group'); h.className = 'vh'; h.id = 'vg-' + g.replace(/\W/g, ''); h.textContent = g; grp.setAttribute('aria-labelledby', h.id)
    grp.append(h)
    for (const n of mine) {
      const o = document.createElement('div')
      o.className = 'vopt'; o.id = 'vo-' + n; o.dataset.v = n; o.setAttribute('role', 'option')
      o.innerHTML = '<span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
      o.firstChild.textContent = niceName(n)
      o.onclick = () => choose(n)
      grp.append(o); opts.push(o)
    }
    list.append(grp)
  }
  markVoice()
}
function markVoice() {
  const voiceName = v.voice
  if (!voiceName) return
  $('vcur').textContent = niceName(voiceName)
  for (const o of opts) o.setAttribute('aria-selected', o.dataset.v === voiceName)
}
function openList() {
  $('vlist').hidden = false; $('vbtn').setAttribute('aria-expanded', 'true')
  $('vlist').focus(); setAct(Math.max(0, opts.findIndex(o => o.dataset.v === v.voice)))
}
function closeList(refocus) {
  if ($('vlist').hidden) return
  $('vlist').hidden = true; $('vbtn').setAttribute('aria-expanded', 'false')
  if (refocus) $('vbtn').focus()
}
function setAct(i) {
  act = Math.min(opts.length - 1, Math.max(0, i))
  opts.forEach((o, j) => o.classList.toggle('act', j === act))
  $('vlist').setAttribute('aria-activedescendant', opts[act].id); opts[act].scrollIntoView({ block: 'nearest' })
}
function choose(name) {
  localStorage.setItem('voice', name); call.set({ voice: name }); markVoice(); closeList(true) // it says "This is how I sound now."
}
$('vbtn').onclick = () => ($('vlist').hidden ? openList() : closeList(true))
$('vbtn').onkeydown = e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if ($('vlist').hidden) openList() } }
$('vlist').onkeydown = e => {
  const step = { ArrowDown: act + 1, ArrowUp: act - 1, Home: 0, End: opts.length - 1 }[e.key]
  if (step != null) { e.preventDefault(); setAct(step) }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (opts[act]) choose(opts[act].dataset.v) }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeList(true) }
  else if (e.key === 'Tab') closeList()
}
addEventListener('pointerdown', e => { if (!$('pick').contains(e.target)) closeList() })
function settings(open = $('setD').hidden, back = true) {
  $('setD').hidden = !open; $('more').setAttribute('aria-expanded', open); $('more').classList.toggle('is-open', open)
  if (open) ($('vbtn').offsetParent ? $('vbtn') : $('phones').offsetParent ? $('phones') : $('setD')).focus?.() // focus moves into the card
  else if (back) $('more').focus()
}
$('more').onclick = () => settings()
addEventListener('pointerdown', e => { if (!$('setD').hidden && !$('setD').contains(e.target) && !$('more').contains(e.target)) settings(false, false) })

// ── the chat ─────────────────────────────────────────────────────────────────
const chat = $('talk')
let voiceBubble = null // the voice's bubble for this turn; its next sentences join it
const drop = b => { const t = b.parentElement; b.remove(); if (!t.children.length) t.remove() }
// The bubble of your first words goes, with anything after it (an answer you never heard): the joined words replace it.
function retract() {
  const all = [...chat.querySelectorAll('.cv-bubble')]
  const i = all.findLastIndex(b => b.parentElement.classList.contains('cv-turn--you') && !b.classList.contains('cv-bubble--live'))
  if (i >= 0) all.slice(i).forEach(drop)
}
function row(who, text, live, wrong) { // wrong: a problem the call server reports, in the voice's bubble with red words
  if (who === 'voice' && voiceBubble && !wrong) { voiceBubble.textContent += ' ' + text; return }
  let turn = chat.lastElementChild
  if (!turn?.classList.contains('cv-turn--' + who)) { turn = Object.assign(document.createElement('div'), { className: 'cv-turn cv-turn--' + who }); chat.append(turn) }
  const b = Object.assign(document.createElement('div'), { className: 'cv-bubble' + (live ? ' cv-bubble--live' : '') + (wrong ? ' cv-bubble--wrong' : ''), textContent: text })
  turn.append(b)
  if (who === 'you') away = false // your own words always come into view
  if (!live) voiceBubble = who === 'voice' && !wrong ? b : null
}
function ghost(text) { // your words so far, '' to clear them
  const g = chat.querySelector('.cv-bubble--live'); if (g) drop(g)
  if (text) row('you', text, true)
}
// New lines keep the chat at its end only if you were there: reading back is not yanked away. Only when it has scrolled does its top fade.
let away = false, lastTop = 0
const stick = () => { if (!away) chat.scrollTop = chat.scrollHeight }
chat.onscroll = () => {
  if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80) away = false; else if (chat.scrollTop < lastTop) away = true
  lastTop = chat.scrollTop; chat.classList.toggle('cv-chat--full', chat.scrollTop > 4); layout()
}
function layout() {
  const bs = chat.querySelectorAll('.cv-bubble')
  $('talkcol').classList.toggle('empty', !bs.length && !link && !blockedBy); // the greeting only while the call can hear
  $('talkcol').classList.toggle('alone', !railRows)
  // Pinned to the bottom with older lines above: a bubble that starts inside the top fade is scrolled away, not drawn cut. (Reading back, the fade itself does it.)
  const top = chat.getBoundingClientRect().top, cut = !away && chat.scrollTop > 4
  for (const b of bs) b.style.visibility = cut && b.getBoundingClientRect().top < top + 32 ? 'hidden' : ''
}
new MutationObserver(() => { stick(); layout() }).observe(chat, { childList: true, subtree: true, characterData: true })
new ResizeObserver(() => { stick(); layout() }).observe(chat)

// A refused microphone (not-allowed): macOS keeping it from Chrome when the page's own permission is granted (or
// getUserMedia said "Permission denied by system"), otherwise Chrome's permission for this page. The page says how to fix
// it and, on a launcher call, tells the server, so the panel shows the button that opens the right settings: its window
// has no address bar. null until the recogniser first hears or is refused.
let blockedBy = null
async function micBlocked(deniedBySystem) {
  const site = await navigator.permissions?.query({ name: 'microphone' }).catch(() => null)
  blockedBy = deniedBySystem || site?.state === 'granted' ? 'mac' : 'chrome'
  render()
  note(blockedBy === 'mac' ? 'Turn the microphone on in System Settings › Privacy & Security, then press Allow.'
    : GO ? 'Chrome blocked the microphone. Press Allow microphone in the Oh Kevin panel in the menu bar.'
    : 'Chrome blocked the microphone. Allow it in the address bar, then press Allow.')
  if (GO) post('/mic', { blocked: blockedBy }).catch(() => {})
  if (GO && site && blockedBy === 'chrome') site.onchange = () => { if (site.state === 'granted' && !v.live) $('call').click() } // allowed in Chrome's settings
}

// ── the controls ─────────────────────────────────────────────────────────────
async function toggleCall() {
  await ready
  const on = !v.live
  note('')
  call.set({ headphones: $('phones').checked })
  const done = call.start(on)
  if (!on && GO && !gone) post('/hangup').catch(() => {}) // a dropped stream must not end a server that is still there
  await done
}
$('call').onclick = toggleCall
// End when the microphone is blocked: the call is not live, so there is nothing to stop; the screen goes back, and a launcher call ends.
$('end').onclick = () => { if (v?.live) return toggleCall(); blockedBy = ''; note(''); if (gone) { link = 'over'; endedByPerson = true; showOver() } else if (GO) post('/hangup').catch(() => {}); render() }
$('mute').onclick = async () => { // Allow, when the microphone is blocked: start listening again
  await ready
  if (link === 'closed') return location.reload() // the stream gave up: a page that loads again is a new try
  if (blockedBy) return toggleCall()
  await call.mute(!v.muted); render()
}
if (GO) addEventListener('load', () => ready.finally(() => setTimeout(() => $('call').click())), { once: true }) // once the call's modules are in, as when a person clicks
$('phones').onchange = () => call?.set({ headphones: $('phones').checked })
$('typed').onsubmit = async e => { e.preventDefault(); await ready; const t = $('box').value.trim(); $('box').value = ''; call.typed(t) }
addEventListener('keydown', e => {
  if (e.key === ',' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); return settings() }
  if (e.key === 'Escape' && !$('setD').hidden) { settings(false); return }
  if (e.key === 'Escape' && openName) { openName = ''; showCrew(); return }
  if (e.target === $('box') && e.key === 'Escape') { $('box').blur(); return }
  if (!$('setD').hidden || e.target.closest('input, textarea, select, [role=listbox]')) return
  if (e.code === 'Space' && !e.target.closest('button, [role=button]')) { e.preventDefault(); call?.hush() }
  else if (e.code === 'KeyM' && !e.ctrlKey && !e.metaKey && !e.altKey && v?.live) $('mute').click()
})

// ── the workers on this call ─────────────────────────────────────────────────
// The board event carries every worker's own board (workers.mjs pageBoard): name, state, task, title. Nothing is read from text.
let project = ''
const crew = [] // { name, topic, state, doing, session, used, closed }
function readBoard(e) { // by name: a worker the server dropped (Close) takes its flags with it
  const old = new Map(crew.map(w => [w.name, w]))
  crew.length = 0
