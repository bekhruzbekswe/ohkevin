<style>
  /* Layout: the path with its one decision drawn first, then each milestone's items. */
  :root {
    --paper: #F3F5FA; --plate: #FFFFFF; --ink: #1A2238; --ink-2: #4A5368; --ink-3: #7A8296;
    --line: #DCE1EC; --track: #EEF1F7; --you: #D6336C; --voice: #2B63E3; --good: #1E8E5A;
    --you-tint: #FBE6EE; --voice-tint: #E4ECFD;
    --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    --cond: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #0F1422; --plate: #171D2E; --ink: #E8ECF6; --ink-2: #AEB6C8; --ink-3: #7C859B;
    --line: #2B3348; --track: #1D2437; --you: #FF6B9D; --voice: #6C9BFF; --good: #2FA36B;
    --you-tint: #3A1A28; --voice-tint: #17264A; color-scheme: dark } }
  :root[data-theme="dark"] {
    --paper: #0F1422; --plate: #171D2E; --ink: #E8ECF6; --ink-2: #AEB6C8; --ink-3: #7C859B;
    --line: #2B3348; --track: #1D2437; --you: #FF6B9D; --voice: #6C9BFF; --good: #2FA36B;
    --you-tint: #3A1A28; --voice-tint: #17264A; color-scheme: dark }
  :root[data-theme="light"] { color-scheme: light }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 1200px; margin: 0 auto; padding-block: 40px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .eyebrow { font: 700 12px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  h1 { font: 800 clamp(32px, 4.6vw, 54px)/1 var(--sans); letter-spacing: -0.035em; margin: 0; }
  .sub { color: var(--ink-2); max-width: 64ch; margin: 12px 0 0; }
  #theme { display: inline-flex; align-items: center; gap: 8px; background: var(--plate); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: 600 14px var(--cond); color: inherit; cursor: pointer; }
  #theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #theme:focus-visible { outline: 2px solid var(--voice); outline-offset: 2px; }

  .path { margin: 28px 0 0; background: var(--plate); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; }
  .path svg { display: block; width: 100%; min-width: 900px; height: auto; }
  .box { fill: var(--plate); stroke: var(--ink-3); stroke-width: 1.4; }
  .ms.doing .box { stroke: var(--voice); stroke-width: 2.4; fill: var(--voice-tint); }
  .ms.check .box { stroke: var(--you); stroke-width: 2.4; fill: var(--you-tint); }
  .ms.done .box { fill: var(--good); stroke: var(--good); }
  .ms.done text { fill: #fff !important; }
  .ms.off { opacity: .35; }
  .num { font: 700 12px var(--cond); letter-spacing: .1em; fill: var(--ink-3); }
  .nm { font: 700 17px var(--sans); fill: var(--ink); }
  .st { font: 600 12.5px var(--cond); fill: var(--ink-2); }
  .wire { fill: none; stroke: var(--ink-3); stroke-width: 1.6; marker-end: url(#ah); }
  .lbl { font: 700 12.5px var(--cond); fill: var(--ink-2); text-anchor: middle; }
  .gate { fill: var(--plate); stroke: var(--ink); stroke-width: 1.6; }

  section { background: var(--plate); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; margin-top: 14px; }
  section.off { opacity: .55; }
  section h2 { font: 700 20px/1.2 var(--sans); margin: 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  section h2 span { font: 600 13px var(--cond); color: var(--ink-3); }
  .goal { color: var(--ink-2); font-size: 15px; margin: 6px 0 12px; max-width: 76ch; }
  .item { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-top: 1px solid var(--track); font-size: 15.5px; line-height: 1.4; }
  .item p { margin: 0; flex: 1; min-width: 0; }
  .item small { display: block; font: 500 13px var(--cond); color: var(--ink-3); }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; box-shadow: inset 0 0 0 2px var(--line); }
  .item.doing .dot { background: var(--voice); box-shadow: none; } .item.check .dot { background: var(--you); box-shadow: none; } .item.done .dot { background: var(--good); box-shadow: none; }
  .tag { flex: none; font: 600 12.5px var(--cond); border-radius: 4px; padding: 2px 9px; background: var(--track); color: var(--ink-2); white-space: nowrap; }
  .item.doing .tag { background: var(--voice-tint); color: var(--voice); } .item.check .tag { background: var(--you-tint); color: var(--you); }
  .item.later p { color: var(--ink-3); }
  .item.done .tag { background: var(--good); color: #fff; }
  section.done { border-top: 3px solid var(--good); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <p class="eyebrow" id="upd"></p>

    </div>
    <button id="theme" type="button" aria-label="Switch between light and dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><span>Dark mode</span></button>
  </div>

      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" style="fill:var(--ink-3)"/></marker></defs>
      <path class="wire" d="M220 150H258"/><path class="wire" d="M460 150H510V70H558"/><path class="wire" d="M510 150V230H558"/><path class="wire" d="M780 230H838"/>
      <circle cx="510" cy="150" r="5" style="fill:var(--ink-3)"/><text class="lbl" x="486" y="140">both</text>
      <text class="num" x="560" y="20">TRACK A · CHROME + LAUNCHER · SHIPS FIRST</text>
      <text class="num" x="560" y="180">TRACK B · SWIFT MACOS APP · FOLLOWS</text>
      <g class="ms" data-id="m1"><rect class="box" x="20" y="110" width="200" height="80" rx="6"/><text class="num" x="36" y="134">MILESTONE 1</text><text class="nm" x="36" y="157">Launcher</text><text class="st" x="36" y="177"></text></g>
      <g class="ms" data-id="m2"><rect class="box" x="260" y="110" width="200" height="80" rx="6"/><text class="num" x="276" y="134">MILESTONE 2</text><text class="nm" x="276" y="157">Swift app test</text><text class="st" x="276" y="177"></text></g>
      <g class="ms" data-id="m3b"><rect class="box" x="560" y="30" width="220" height="80" rx="6"/><text class="num" x="576" y="54">MILESTONE 3A</text><text class="nm" x="576" y="77" style="font-size:15.5px">Ship today's product</text><text class="st" x="576" y="97"></text></g>
      <g class="ms" data-id="m3a"><rect class="box" x="560" y="190" width="220" height="80" rx="6"/><text class="num" x="576" y="214">MILESTONE 3B</text><text class="nm" x="576" y="237" style="font-size:15.5px">Build the Swift app</text><text class="st" x="576" y="257"></text></g>
      <g class="ms" data-id="m4"><rect class="box" x="840" y="190" width="220" height="80" rx="6"/><text class="num" x="856" y="214">MILESTONE 4B</text><text class="nm" x="856" y="237" style="font-size:15.5px">Ship the Mac app</text><text class="st" x="856" y="257"></text></g>
    </svg>
  </figure>

  <div id="list"></div>
</main>
<script>
const data = JSON.parse(document.getElementById('data').textContent)
const LABEL = { done: 'Done', check: 'Your check', doing: 'In progress', later: 'Later' }
const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls || '', textContent: text || '' })
document.getElementById('upd').textContent = `Updated ${data.updated}`
for (const m of data.milestones) {
  const done = m.items.filter(x => x.s === 'done').length, all = m.items.length
  const state = done === all ? 'done' : ['check', 'doing'].find(s => m.items.some(x => x.s === s)) ?? 'later'
  const off = m.when && data.gate !== 'open' && data.gate !== m.when // the branch not taken
  const g = document.querySelector(`.ms[data-id="${m.id}"]`)
  g.classList.add(state); if (off) g.classList.add('off')
  g.querySelector('.st').textContent = off ? 'not taken' : state === 'later' ? (m.when && data.gate === 'open' ? 'depends on the test' : 'not started') : `${LABEL[state]} · ${done} of ${all} done`
  const sec = el('section', off ? 'off' : state === 'done' ? 'done' : ''), h = el('h2', '', `${m.n}. ${m.name}`)
  if (m.track) sec.append(el('p', 'eyebrow', m.track))
  h.append(el('span', '', off ? 'not taken' : `${done} of ${all} done`))
  sec.append(h, el('p', 'goal', m.goal))
  for (const it of m.items) {
    const row = el('div', `item ${it.s}`), p = el('p', '', it.t)
    if (it.n) p.append(el('small', '', it.n))
    row.append(el('span', 'dot'), p, el('span', 'tag', LABEL[it.s])); sec.append(row)
  }
  document.getElementById('list').append(sec)
}
const root = document.documentElement, $ = id => document.getElementById(id)
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
const label = () => { $('theme').lastElementChild.textContent = isDark() ? 'Light mode' : 'Dark mode' }
try { const saved = localStorage.getItem('theme'); if (saved === 'dark' || saved === 'light') root.dataset.theme = saved } catch {}
$('theme').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('theme', root.dataset.theme) } catch {}; label() }
label()
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', label)
</script>

</html>
